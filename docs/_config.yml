remote_theme: just-the-docs/just-the-docs
color_scheme: custom
logo: images/logo.png

# Enables `redirect_from:` in a page's front matter, so a page that moves can
# leave its old URL working. Without this key the front matter is silently
# ignored and the old URL 404s. The gem ships with the `github-pages` bundle
# that GitHub Pages already builds this site with, so nothing new is installed.
plugins:
  - jekyll-redirect-from


# https://github.com/just-the-docs/just-the-docs/discussions/1583
callouts_level: quiet # or loud
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red