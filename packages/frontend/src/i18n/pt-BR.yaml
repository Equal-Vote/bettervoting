# Info bubbles
tips:
  nota:
    title: Nenhuma das anteriores
    description: Funciona como qualquer outra opção, mas sempre aparece no fim da cédula. A maioria dos métodos permite que os eleitores apoiem "Nenhuma das anteriores" além das outras opções.

  random_tie_order:
    title: Ordem do desempate aleatório
    description: Os empates aleatórios são resolvidos da maior para a menor prioridade, na ordem {{tiebreak_candidate_names}}. Essa ordem foi definida embaralhando a lista original de candidatos. [Saiba mais sobre empates](https://docs.bettervoting.com/help/ties.html#random-tie-breakers)

  public_archive:
    title: Arquivo público de eleições
    description: Esta é uma lista de eleições públicas reproduzidas no BetterVoting para fins de pesquisa

  full_editor:
    title: Editor completo
    description: O editor completo permite continuar editando a {{election}} e oferece recursos avançados, como várias {{races}} na mesma {{election}} e lista de eleitores definida. Também há várias configurações extras, como horários de início e término e ajustes na política de segurança.

  columns_given:
    title: Número de {{preferences}} dadas
    description: Porcentagem de eleitores que deram cada quantidade de {{preferences}}

  columns_used:
    title: Quais notas foram usadas
    description: Porcentagem de eleitores que usaram cada nota pelo menos uma vez

  voter_profile:
    title: Perfil médio do eleitor
    description: Mostra como os apoiadores de cada candidato classificaram, pontuaram ou aprovaram os demais candidatos

  head_to_head:
    title: Confrontos diretos
    description: Mostra qual candidato venceria cada confronto direto, com base nas preferências que os eleitores marcaram na cédula. A informação é idêntica à de uma matriz de preferências ou de segundo turno.

  random_candidate_order:
    title: Ordem aleatória das opções
    description: Embaralha a ordem das opções nas cédulas.

  ballot_updates:
    title: Permitir que os eleitores alterem a {{ballot}}
    description: Permite que os eleitores alterem o voto enquanto a {{election}} ainda estiver aberta

  public_results:
    title: Resultados públicos
    description: >
      Define se os eleitores podem ver os resultados da {{election}}.
      Quando ativado durante uma {{election}} aberta, os eleitores verão os resultados preliminares depois de enviarem sua {{ballot}}.
      {{capital_elections}} de grande visibilidade costumam manter os resultados ocultos até o encerramento da {{election}}.
    learn_link: https://docs.bettervoting.com/help/preliminary_results.html

  voter_groups:
    title: Ativar grupos de eleitores
    description: Permite que diferentes grupos de eleitores tenham acesso a diferentes {{races}} dentro de uma {{election}} maior (por exemplo, distritos dentro de uma jurisdição).

  email_list:
    title: $t(wizard.email_list_title)
    description: $t(wizard.email_list_description). Recomendado para maximizar a segurança.

  id_list:
    title: $t(wizard.id_list_title)
    description: $t(wizard.id_list_description). Oferece mais flexibilidade do que a opção de lista de e-mails.

  custom_email_invite:
    title: Personalizar e-mails para os eleitores
    description: Personalize o conteúdo dos e-mails enviados aos seus eleitores.

  require_instruction_confirmation:
    title: Confirmar que o eleitor leu as instruções
    description: Exige que os eleitores confirmem que leram as instruções da cédula antes de votar.

  draggable_ballot:
    title: Usar cédulas de arrastar e soltar no Voto RCV
    description: Ativa uma interface de arrastar e soltar nas cédulas do Voto RCV, para que os eleitores classifiquem as opções arrastando-as para a ordem desejada.

  is_public:
    title: Tornar a {{election}} pesquisável publicamente
    description: Permite que a {{election}} apareça na página de eleições e enquetes públicas.

  max_rankings:
    title: Definir o número de posições permitidas
    description: Define o número máximo de posições nas cédulas ranqueadas. (Deve ficar entre {{min_rankings}} e {{max_rankings}})

  contact_email:
    title: E-mail de suporte da {{election}}
    description: >
      Este e-mail ficará visível na página da {{election}} para que seus eleitores entrem em contato caso tenham dúvidas ou precisem de ajuda.
      Isso é especialmente importante em {{elections}} restritas, nas quais você gerencia um grupo específico de eleitores.

  bloc_multi_winner:
    title: Vários vencedores (básico)
    description: >
      Elege o primeiro vencedor como em uma eleição de vencedor único e repete o processo até preencher todas as vagas.
      Ideal para eleger vencedores fortes, com o maior apoio possível.

  proportional_multi_winner:
    title: Vários vencedores (proporcional)
    description: >
      Usa um algoritmo de representação proporcional para definir uma cota de vitória e garantir que grupos possam vencer se tiverem apoiadores suficientes para atingir uma cota.
      Ideal para eleger vencedores diversos, que reflitam a composição ideológica do eleitorado.
    learn_link: https://equal.vote/pr

  no_auth:
    title: Sem limite de votos
    description: Permite votos ilimitados por dispositivo. Ótimo para demonstrações ou quando todos os seus eleitores usam o mesmo dispositivo.

  ip_auth:
    title: Um voto por IP
    description: >
      Permite apenas um voto por endereço IP. Isso dificulta votar várias vezes no mesmo dispositivo, mas impede que vários eleitores
      votem se estiverem na mesma rede Wi-Fi. Ótimo para aumentar a segurança em {{elections}} públicas e anônimas,
      sem prejudicar a experiência do usuário.

  device_auth:
    title: Um voto por dispositivo
    description: >
      Armazena um cookie para garantir que o eleitor não vote várias vezes usando o mesmo navegador.
      Oferece uma ótima experiência ao usuário e, ao mesmo tempo, garante uma segurança básica.

  login_auth:
    title: Um voto por usuário
    description: >
      Só permite votos de pessoas que criaram uma conta no BetterVoting e verificaram o endereço de e-mail.
      Ótimo para maximizar a segurança em {{elections}} públicas e anônimas.

  election_title:
    title: Título
    description: >
      Este é o título da {{election}}. Ele pode ser igual ao {{race_title}} ou diferente.

  polls_vs_elections:
    title: Eleições x enquetes
    description: Não há diferença funcional, apenas de terminologia. Uma enquete usa termos como “opção” e “pergunta”. Uma eleição usa termos como “candidato” e “disputa”.

  restricted:
    title: '{{capital_election}} restrita'
    description: '{{capital_elections}} restritas só permitem votos de quem está na lista de eleitores. A lista de eleitores pode ser um conjunto de e-mails ou de IDs de eleitor.'

  star:
    title: $t(methods.star.full_name)
    description: Os eleitores dão a cada {{candidate}} de 0 (pior) a 5 estrelas (melhor). {{capital_candidates}} com as duas maiores pontuações vão para o segundo turno, e vence o finalista com mais votos.

  approval:
    title: $t(methods.approval.full_name)
    description: Os eleitores aprovam {{candidates}} à vontade, e vence quem tiver mais aprovações.

  ranked_robin:
    title: $t(methods.ranked_robin.full_name)
    description: Ganha quem vencer todos os confrontos diretos. (Também conhecido como método de Condorcet.)

