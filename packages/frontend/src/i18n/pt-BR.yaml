# About
about:
  title: Sobre o BetterVoting.com
  description: >
    O BetterVoting.com ainda está em construção. Ele é o sucessor do site star.vote.


    Ele oferece uma forma fácil de criar eleições seguras com métodos de votação
    que evitam a divisão de votos.


    A ferramenta é de código aberto e, futuramente, oferecerá suporte a diversos
    métodos de vencedor único, como STAR, Aprovação e Ranked Robin, além de
    métodos proporcionais com vários vencedores, como o STAR Proporcional.


    Ela também é flexível para se adaptar ao seu cenário de votação, seja uma grande
    enquete pública, uma eleição de diretoria com muito em jogo ou só uma enquete descontraída
    para escolher um restaurante: o bettervoting.com atende às suas necessidades e oferece uma eleição segura e auditável.
