# Initial Landing page for voter (ex. https://bettervoting.com/j87vqp/)
election_home:
  # start_time example: https://bettervoting.com/tcpwth
  start_time: 'A {{election}} começa em {{datetime, datetime}}'
  end_time: 'A {{election}} termina em {{datetime, datetime}}'
  ended_time: 'A {{election}} terminou em {{datetime, datetime}}'
  vote: Votar
  or_view_results: ou ver os resultados
  ballot_submitted: '{{capital_ballot}} enviada'
  view_results: Ver resultados
  drafted: Esta {{election}} ainda está em rascunho
  archived: Esta {{election}} foi arquivada

election_history:
  title: Registro de auditoria da {{election}}
  subtitle: Um registro público de tudo o que aconteceu com esta {{election}} desde que ela foi finalizada.
  ladder_note: 'Observação: para proteger a privacidade dos eleitores, a contagem de cédulas só é informada em marcos específicos (1, 5, 10, 25, 50, 100, 250, ...), e as edições de cédulas usam uma escala mais detalhada (1, 2, 5, 10, 25, ...). Pelo mesmo motivo, eventos relacionados a cédulas são informados apenas com precisão de dia.'
  link: Registro de auditoria
  loading: Carregando registro de auditoria…
  empty: Nenhum evento registrado ainda.
  not_finalized: Esta {{election}} ainda não foi finalizada, então não há registro de auditoria disponível.
  # Column headers and event chip labels live in EnhancedTable's head cell pool,
  # which keys its group filters and chip colours off plain English strings.
  desc:
    state_initial: 'A {{election}} entrou no estado "$t(election_state.{{to}})"'
    state_change: 'Estado alterado de "$t(election_state.{{from}})" para "$t(election_state.{{to}})"'
    preliminary_on: Resultados preliminares ON
    preliminary_off: Resultados preliminares OFF
    ballots_milestone: 'O número de cédulas recebidas chegou a {{count}}'
    upload_ballots: 'Um administrador importou {{count}} cédula(s)'
    edits_milestone: 'O número de edições de cédulas chegou a {{count}}'
    voter_revealed: Um administrador usou a ferramenta de acesso emergencial para revelar o ID de um eleitor

# Ballot (ex. https://bettervoting.com/j87vqp/vote)
ballot:
  this_election_uses: Esta {{election}} usará o {{voting_method}} para eleger {{spelled_count}} $t(winner.winner).
  this_election_uses_draggable: Esta {{election}} usará {{voting_method}}, com cédula de arrastar e soltar, para eleger {{spelled_count}} $t(winner.winner).
  instructions_checkbox: Li as instruções
  learn_more: Saiba mais sobre {{voting_method}}
  previous: Anterior
  next: Próximo
  submit_ballot: Enviar
  submitting: Enviando...

  # Draggable RCV UI strings
  available: '{{capital_candidates}} disponíveis'
  yourRankings: Sua classificação
  drop_here: Solte aqui para classificar
  no_available: Não há {{candidates}} disponíveis
  instructions: Arraste da lista da esquerda para a da direita. A lista da direita mostra sua ordem de preferência; o que ficar à esquerda não será classificado.
  instructions_rcv_draggable: Arraste da esquerda para a direita (→). A posição 1 é a sua primeira escolha. Seu voto nunca vai para {{candidates}} que você deixar sem classificação.

  dialog_submit_title: Enviar {{ballot}}?
  dialog_send_receipt: Enviar comprovante por e-mail?
  dialog_email_placeholder: E-mail para o comprovante (opcional)
  dialog_cancel: Cancelar
  dialog_submit: Enviar
  dialog_abstention: 'Abstenção: tudo foi deixado em branco ou marcado da mesma forma'
  warnings:
    skipped_rank: Não pule posições. Classifique em sequência para deixar suas preferências claras. {{capital_candidates}} sem classificação ficam em último lugar.
    duplicate_rank: Cada posição só pode ser usada uma vez. (Repetir uma posição pode anular sua {{ballot}}.)

  methods:
    approval:
      instruction_bullets:
        - Preencha o círculo ao lado da sua opção favorita
        - Você pode marcar quantas opções quiser
      footer_single_winner: Vence a opção com mais votos
      footer_multi_winner: Vencem as {{n}} opções com mais votos
      left_title: ''
      right_title: ''
      heading_prefix: ''
    star_pr:
      instruction_bullets:
       - Dê cinco estrelas para sua opção favorita (pode ser mais de uma).
       - Dê zero para sua opção menos preferida (pode ser mais de uma) ou deixe em branco.
       - Dê a cada {{candidate}} restante a nota que quiser.
       - Notas iguais indicam apoio igual.
      footer_single_winner: ''
      footer_multi_winner: >
        No Voto STAR Proporcional, os vencedores são escolhidos em rodadas. Cada rodada elege a opção com a maior pontuação total
        e, em seguida, considera representados os eleitores que mais a apoiaram. As rodadas seguintes incluem todos os eleitores que
        ainda não estão totalmente representados.
      # These show above the star columns
      left_title: 'Pior'
      right_title: 'Melhor'
    star:
      instruction_bullets:
       - Dê cinco estrelas para sua opção favorita (pode ser mais de uma).
       - Dê zero estrelas para sua opção menos preferida (pode ser mais de uma) ou deixe em branco.
       - Dê a cada {{candidate}} restante a nota que quiser.
       - Notas iguais indicam apoio igual.
      footer_single_winner: |
        {{capital_candidates}} com as duas maiores pontuações vão para o segundo turno.
        Seu voto inteiro vai para o finalista de sua preferência.
      footer_multi_winner: >
        Esta {{election}} usa o Voto STAR e elegerá {{n}} vencedores.
        No Voto STAR, {{candidates}} com as duas maiores pontuações vão para o segundo turno, e vence o finalista preferido por mais eleitores.
      # These show above the star columns
      left_title: 'Pior'
      right_title: 'Melhor'
    rcv:
      instruction_bullets:
        - Classifique em ordem de preferência (1º, 2º, 3º etc.).
        - Não é permitido repetir posições.
        - '{{capital_candidates}} que você deixar em branco ficam em último lugar'
      footer_single_winner: >
        Como o RCV é apurado: as cédulas são contadas em rodadas eliminatórias. Em cada rodada, seu voto vai para o candidato que você colocou na melhor posição,
        quando possível. Se nenhum candidato tiver a maioria dos votos restantes, o candidato com menos votos é eliminado.
        Se o seu voto não puder ser transferido, ele não será contado nas rodadas seguintes. Se um candidato tiver a maioria dos votos restantes
        em uma rodada, ele é eleito.
      left_title: ''
      right_title: ''
    stv:
      instruction_bullets:
        - Classifique em ordem de preferência (1º, 2º, 3º etc.).
        - Não é permitido repetir posições.
        - '{{capital_candidates}} que você deixar em branco ficam em último lugar'
      footer_multi_winner: ''
      left_title: ''
      right_title: ''
    ranked_robin:
      instruction_bullets:
        - Classifique em ordem de preferência.
        - É permitido repetir posições
        - '{{capital_candidates}} que você deixar em branco ficam em último lugar'
      footer_single_winner: |
        {{capital_candidates}} se enfrentam em confrontos diretos.
        Em cada confronto, vence quem estiver à frente na cédula de mais eleitores
      left_title: ''
      right_title: ''
    choose_one:
      instruction_bullets:
        - Preencha o círculo ao lado da sua opção favorita
      footer_single_winner: Vence a opção com mais votos
      footer_multi_winner: Vencem as {{n}} opções com mais votos
      left_title: ''
      right_title: ''

