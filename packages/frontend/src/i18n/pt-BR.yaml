  beta_warning: Este aplicativo ainda está em desenvolvimento e pode conter bugs. Use o botão de feedback para nos ajudar a melhorar.

# Footer (bottom of all pages)
footer:
  project_title: BetterVoting
  project_description: >
    O BetterVoting existe para tornar a eleição ideal acessível
    para quem vota e fácil de conduzir.


    Nossa missão é apoiar e
    impulsionar a adoção e o uso de métodos de votação melhores, como o Voto STAR,
    em enquetes, pesquisas e eleições reais, em qualquer escala e para qualquer cenário.


    O BetterVoting.com é o sucessor do app star.vote. A experiência clássica continua disponível em [classic.star.vote](https://classic.star.vote).

  # TODO: I'll add this section to project description once we have those features in place
  # All of our voting methods can be used for single winner, multi-winner, or
  # proportional representation elections with either paper or digital ballots.
  about_us_title: Sobre nós
  about_us_description: >
    O BetterVoting é um projeto da Equal Vote Coalition, uma organização apartidária e sem fins lucrativos (501(c)(3), nos EUA).
    Nossa missão é lutar pela verdadeira igualdade no próprio voto.


    [Doações](https://www.equal.vote/donate) são a melhor forma de apoiar nosso trabalho. Toda a receita do
    BetterVoting vai diretamente para financiar e apoiar a adoção e o uso do Voto STAR.


    Equal Vote Coalition

    PO Box 51245, Eugene, OR, USA 97405

    https://www.equal.vote
  social_action: 'Curta e siga nas redes sociais:'

###################################
#### PRIORITY 2 : Landing Page ####
###################################

# Landing Page
landing_page:
  # Hero Section
  hero:
    title: Crie eleições e enquetes com métodos de votação melhores
    candidates:
      - Menos preferido
      - Meio-termo
      - Favorito
    methods:
      star:
        title: $t(methods.star.full_name) !tip(star)
        recommendation: Recomendado pela precisão
        default_scores:
          - 0
          - 2
          - 5
      approval:
        title: $t(methods.approval.short_name) !tip(approval)
        recommendation: Recomendado pela simplicidade
        default_scores:
          - 0
          - 1
          - 1
      ranked_robin:
        title: $t(methods.ranked_robin.short_name) !tip(ranked_robin)
        recommendation: Recomendado para votos ranqueados
        default_ranks:
          - 3
          - 2
          - 1
      more_methods:
        title: e mais
        sign_in_description: Entre para usar métodos com vários vencedores
        sign_in: Entrar

  # Election Stats Section
  election_stats:
    elections_created: Eleições e enquetes criadas
    votes_cast: Votos registrados

  # Features Section
  features:
    title: Funcionalidades
    items:
    - title: Métodos de votação
      text: Os métodos de votação recomendados incluem $t(methods.star.short_name), $t(methods.approval.short_name) e $t(methods.ranked_robin.short_name) (além das versões proporcionais). Também oferece suporte ao Voto de Escolha Única e ao Voto RCV.
    - title: Métodos com vários vencedores
      text: Oferece suporte a métodos que elegem vários vencedores, incluindo métodos proporcionais e métodos básicos com vários vencedores.
    - title: Eleições com várias disputas
      text: Configure eleições com várias disputas quando houver diversas questões ou cargos em votação.
    - title: Cédulas de papel
      text: Use [um modelo](https://docs.google.com/presentation/d/1va-XEsUy0VI0jCTAHrQ_f9HNKex3VK9cm7WfF6jhUYM/edit) para criar suas cédulas de papel. Depois, essas cédulas podem ser apuradas manualmente ou inseridas no sistema e apuradas automaticamente. Importação de CSV em breve.
    - title: Eleições seguras
      text: Oferece diversas opções de segurança, incluindo verificação de e-mail, IDs de eleitor, listas de e-mails importadas e links diretos de votação.
    - title: Enquetes acessíveis
      text: Opções rápidas e fáceis para criar e compartilhar uma enquete pública on-line.
    - title: Compare métodos
      text: Permita que os eleitores votem em uma mesma questão com vários métodos para comparar a experiência de voto e os vencedores. Basta duplicar sua disputa e selecionar métodos diferentes.
    - title: Materiais educativos
      text: Encontre tudo o que você precisa para aprender sobre métodos de votação e escolher a melhor opção para você.

  # Featured Elections Section
  featured_elections:
    title: Vote em uma eleição de demonstração do BetterVoting
    button: Ver eleições e enquetes públicas

  # Sign Up Section
  sign_up:
    text: Cadastre-se para criar sua primeira eleição (é grátis!)
    button: Cadastre-se

  # Testimonials Section
  testimonials:
    title: Depoimentos
    items:
      - quote: O Voto STAR é incrível!
        name: John Doe
        image_url: 'https://yt3.googleusercontent.com/el7OsIUIJVHjHIwsNXgrBVft0Ht3RSfJ3wO94MQivXaa_IK0JMGlHrPIbvt8fYtXvjJfErcdG-Y=s176-c-k-c0x00ffffff-no-rj'
      - quote: O Voto STAR é incrível!
        name: Jane Doe
        image_url: 'https://yt3.googleusercontent.com/el7OsIUIJVHjHIwsNXgrBVft0Ht3RSfJ3wO94MQivXaa_IK0JMGlHrPIbvt8fYtXvjJfErcdG-Y=s176-c-k-c0x00ffffff-no-rj'
      - quote: 'O Voto STAR é incrível!'
        name: 'Equal Vote'
        image_url: 'https://yt3.googleusercontent.com/el7OsIUIJVHjHIwsNXgrBVft0Ht3RSfJ3wO94MQivXaa_IK0JMGlHrPIbvt8fYtXvjJfErcdG-Y=s176-c-k-c0x00ffffff-no-rj'

  # Pricing Section
  pricing:
    title: Preços
    items:
    -  title: Plano gratuito
       price: US$ 0,00
       description: |
        Eleitores ilimitados em eleições públicas

        Não é necessário cartão de crédito

        Eleições privadas com até 100 eleitores
    -  title: Plano profissional
       price: Solicite um orçamento
       description: |
        Eleições privadas com mais de 100 eleitores

        Toda a receita é revertida para atividades sem fins lucrativos

        Descontos disponíveis mediante solicitação

        Envie um e-mail para [elections@equal.vote](mailto)

  other_tools:
    title: Outras ferramentas que adoramos
    items:
      - name: STAR Fit (starbestfit.com)
        description: Use o Voto STAR para encontrar o melhor horário para suas reuniões
        icon_url: https://starbestfit.com/_next/static/media/logo.4a868e2a.svg
        url: https://starbestfit.com/
      - name: Voto STAR nos Formulários Google
        description: Use nosso complemento para apurar eleições com Voto STAR nos Formulários Google
        icon_url: https://www.gstatic.com/images/branding/product/2x/forms_2020q4_48dp.png
        url: https://docs.bettervoting.com/other_tools/google_forms.html
