      - '{{capital_candidate}}'
      - Votos
      - '% do total de votos'

  approval:
    bar_title: Aprovações por {{candidate}}
    table_title: Tabela
    table_columns:
      - '{{capital_candidate}}'
      - Votos
      - '% do total de votos'

  ranked_robin:
    bar_title: Vitórias em confrontos diretos
    table_title: Tabela
    table_columns:
      - '{{capital_candidate}}'
      - 'Nº de vitórias'
      - Taxa de vitórias

  rcv:
    first_choice_title: Primeiras preferências
    final_round_title: Rodada final
    table_title: Rodadas de apuração do Voto RCV
    runoff_majority: limite da maioria (½ dos votos ativos restantes)
    exhausted: Esgotados
    tabulation_candidate_column: '{{capital_candidate}}'
    round_column: Rodada {{n}}
    bloc_results_title: Primeira e última rodada na definição de cada vencedor

  stv:
    table_title: Rodadas de apuração do VUT

  star:
    score_title: Rodada de pontuação
    score_description:
      - As estrelas de todas as cédulas são somadas.
      - '{{capital_candidates}} com as duas maiores pontuações são os finalistas.'
    runoff_title: Segundo turno automático
    runoff_description:
      - Cada voto vai para o finalista preferido pelo eleitor.
      - Vence o finalista com mais votos.
    runoff_majority: limite da maioria (½ dos eleitores com preferência)
    runoff_equal_support_footnote: "{{percentage}}% dos eleitores deram apoio igual aos dois finalistas."
    score_table_title: Tabela de pontuação
    score_table_columns:
      - '{{capital_candidate}}'
      - Pontuação
    runoff_table_title: Tabela do segundo turno
    runoff_table_columns:
      - '{{capital_candidate}}'
      - Votos no segundo turno
      - '% dos votos no segundo turno'
      - '% entre os finalistas'

    detailed_steps_title: Etapas da apuração
    tiebreaker_note_title: Sobre os desempates
    tiebreaker_note_text:
      - Esta {{election}} precisou de um desempate. Empates são muito menos prováveis no Voto STAR do que no Voto de Escolha Única ou no RCV.
      - Em geral, empates deixam de ser um problema à medida que o número de eleitores aumenta; mas, quando acontecem, o BetterVoting segue um protocolo de desempate para escolher os vencedores mais representativos.
      - Para entender como o empate foi resolvido, recomendamos [conhecer o Protocolo Oficial de Desempate do Voto STAR](https://starvoting.org/ties) e depois acompanhar as etapas abaixo para ver como ele foi resolvido nesta {{election}}.
    equal_preferences_title: Distribuição do apoio igual
    equal_preferences: Apoio igual
    equal_preferences_pair: '{{winner}} x {{runner_up}}'
    seat_heading: Vencedor {{n}}
    score_higher_than_runoff_title: Por que o candidato com a maior pontuação não é o vencedor?
    score_higher_than_runoff_text: |
      Muitas vezes, o candidato com a maior pontuação é o mesmo que vence o segundo turno, mas nem sempre.
      A rodada de pontuação mede o apoio geral a cada um dos candidatos,
      mas, no fim, o vencedor é o finalista preferido por mais eleitores.
      Isso garante a igualdade do voto e também incentiva o voto sincero.

  star_pr:
    chart_title: Resultados da rodada {{n}}
    table_title: Tabela de resultados
    table_columns:
      - '{{capital_candidate}}'
    round_column: Rodada {{n}}

