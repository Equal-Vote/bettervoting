      equal: Deram a mesma aprovação
    ranked_robin:
      higher: Colocaram {{name}} à frente
      equal: Deram a mesma posição
    rcv:
      higher: Colocaram {{name}} à frente
      equal: Não classificaram nenhuma das duas opções
    stv: # Matches RCV
      higher: Colocaram {{name}} à frente
      equal: Não classificaram nenhuma das duas opções

  candidate_selector: '{{capital_candidate}}'

  voter_profile_title: Perfil médio dos apoiadores !tip(voter_profile)
  voter_profile_count: '{{count}} eleitores deram apoio máximo a {{name}}'
  voter_profile_count_one: '{{count}} eleitor deu apoio máximo a {{name}}'
  voter_profile_count_zero: 'Nenhum eleitor deu apoio máximo a {{name}}'
  voter_profile_preferred_frontrunner: "Preferência dos apoiadores de {{name}} entre os líderes:"
  voter_profile_average_scores: "Notas médias dadas pelos apoiadores de {{name}}:"
  voter_profile_average_ranks: "Posições médias dadas pelos apoiadores de {{name}}:"
  voter_profile_error_rates: "Taxas de erro dos apoiadores de {{name}}:"

  column_distribution_title: Distribuição das {{preferences}}
  column_distribution_num_avg: 'Número médio de {{preferences}} por eleitor: {{count}}'
  column_distribution_num_title: Número de {{preferences}} dadas !tip(columns_given)
  column_distribution_which_title: Quais {{preferences}} foram usadas? !tip(columns_used)

  voter_intent_title: Intenção dos eleitores

  voter_error_title: Erros dos eleitores

  name_recognition_title: Reconhecimento de nome
  name_recognition_sub_title: Quantos eleitores deram alguma nota ao candidato (em vez de deixá-lo em branco)
  name_recognition_blank_warning: >
    Não dar nota a um candidato é o mesmo que dar zero a ele.
    Mesmo assim, essa escolha do eleitor nos dá uma ideia de quais candidatos ele
    conhece melhor.

  score_range_title: Amplitude das notas
  score_range_sub_title: Diferença entre a nota máxima e a mínima em cada cédula
  score_range_warning: >
    Para ter o máximo de impacto na rodada de pontuação do Voto STAR, os eleitores precisam
    seguir as instruções da cédula e dar pelo menos um zero (ou deixar em branco)
    e pelo menos um cinco. Isso resulta em uma amplitude de 5 nas notas do eleitor.


    Dito isso, a cédula ainda tem impacto total no segundo turno automático, em que
    o voto inteiro do eleitor vai para o finalista que recebeu dele a nota mais alta.


    Quem não usou toda a escala pode não ter entendido as instruções ou pode ter escolhido
    uma escala menor de propósito. Pode ser um voto de protesto, expressando que nenhum candidato merece 5 estrelas,
    ou o contrário: a escolha de mostrar uma opinião positiva sobre todos.


    Observe que as consequências de não seguir as instruções são relativamente pequenas, enquanto não seguir
    as instruções no Voto RCV pode anular a cédula (por exemplo, ao dar a primeira posição a mais de um candidato). Os eleitores
    também tendem muito mais a usar toda a escala em eleições políticas, nas quais têm opiniões fortes.
    
