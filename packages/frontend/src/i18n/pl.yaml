    bloc_results_title: Pierwsza i ostatnia runda wyłaniania każdego zwycięzcy

  stv:
    table_title: Rundy tabulacji STV

  star:
    score_title: Runda oceniania
    score_description:
      - Zsumuj gwiazdki ze wszystkich kart do głosowania.
      - Do finału przechodzą {{candidates}} z dwoma najwyższymi wynikami.
    runoff_title: Runda automatycznej dogrywki
    runoff_description:
      - Każdy głos trafia do finalisty preferowanego przez głosującego.
      - Wygrywa finalista z największą liczbą głosów.
    runoff_majority: większość głosujących z preferencją
    runoff_no_preference_footnote: "{{percentage}}% głosujących nie wyraziło preferencji między dwoma finalistami."
    score_table_title: Tabela wyników
    score_table_columns:
      - '{{capital_candidate}}'
      - Wynik
    runoff_table_title: Tabela dogrywki
    runoff_table_columns:
      - '{{capital_candidate}}'
      - Głosy w dogrywce
      - '% głosów w dogrywce'
      - '% między finalistami'

    detailed_steps_title: Kroki tabulacji
    tiebreaker_note_title: Uwaga o rozstrzyganiu remisów
    tiebreaker_note_text:
      - Remisy są rozstrzygane, gdy tylko to możliwe, zgodnie z [oficjalnym protokołem rozstrzygania remisów](https://starvoting.org/ties).
      - W głosowaniu STAR remisy zdarzają się dziesięciokrotnie rzadziej niż w głosowaniu na jednego kandydata i zwykle przestają występować wraz ze wzrostem liczby głosujących.
      - Aby zrozumieć, jak rozstrzygnięto remis, zalecamy [zapoznać się z oficjalnym protokołem rozstrzygania remisów w głosowaniu STAR](https://starvoting.org/ties), a następnie prześledzić poniższe kroki, aby zobaczyć, jak rozstrzygnięto go w tych wyborach.
    equal_preferences_title: Rozkład równego poparcia
    equal_preferences: Równe poparcie
    score_higher_than_runoff_title: Dlaczego kandydat z najwyższym wynikiem różni się od zwycięzcy?
    score_higher_than_runoff_text: |
      Kandydat z najwyższym wynikiem często pokrywa się ze zwycięzcą dogrywki, ale nie zawsze.
      W dogrywce liczy się wyłącznie to, którego finalistę głosujący woli, co może zmienić rozstrzygnięcie.
      Na przykład głos 5 kontra 4 gwiazdki ma mniejszy wpływ w rundzie oceniania, ale w dogrywce liczy się w pełni,
      a głos 5 kontra 0 gwiazdek robi dużą różnicę w ocenianiu, lecz w dogrywce waży tyle samo.
      Zwycięzca dogrywki wygrywa, ponieważ więcej głosujących woli go od drugiego finalisty.
    # Alternate Text:
    # The top-scoring candidate usually matches the winner in the runoff, but not always. 
    # The runoff round counts only the votes for the candidate a voter most prefers, which can lead to different weightings than in the scoring round. 
    # For example, a slight preference (like 5 vs. 4 stars) has a small impact in scoring but counts as one full vote in the runoff. 
    # Conversely, a strong preference (like 5 vs. 0 stars) makes a big difference in scoring but carries the same weight in the runoff. 
    # Ultimately, the runoff winner becomes the final winner because they are preferred by more voters over the runner-up.

  star_pr:
    chart_title: Wyniki rundy {{n}}
    table_title: Tabela wyników
    table_columns:
      - '{{capital_candidate}}'
    round_column: Runda {{n}}

