# Ballot (ex. https://bettervoting.com/j87vqp/vote)
ballot:
  this_election_uses: Te {{election}} wykorzystują metodę głosowania {{voting_method}}, aby wybrać {{spelled_count}} $t(winner.winner)
  this_election_uses_draggable: Te {{election}} wykorzystują metodę głosowania {{voting_method}} z przeciąganymi kartami do głosowania, aby wybrać {{spelled_count}} $t(winner.winner)
  instructions_checkbox: Zapoznałem/Zapoznałam się z instrukcjami
  learn_more: Dowiedz się więcej o {{voting_method}}
  previous: Wcześniejszy
  next: Następny
  submit_ballot: Wyślij
  submitting: Wysyłam...

  # Draggable RCV UI strings
  available: Dostępni kandydaci
  yourRankings: Twój ranking
  drop_here: Upuść tutaj kandydatów, aby ich uszeregować
  no_available: Brak dostępnych kandydatów
  instructions: Przeciągnij kandydatów z listy po lewej stronie na prawą. Kandydaci po prawej tworzą Twój ranking; po lewej pozostają nieuszeregowani.
  instructions_rcv_draggable: Przeciągnij kandydatów z lewej → na prawą. Pozycja 1 to Twój najlepszy wybór. Nieuszeregowani oznaczają brak preferencji.

  dialog_submit_title: Wyślij {{capital_ballot}}?
  dialog_send_receipt: Czy wysłać e-mail z potwierdzeniem głosowania? 
  dialog_email_placeholder: Potwierdzenie e-mailem
  dialog_cancel: Anuluj
  dialog_submit: Wyślij
  dialog_abstention: Wstrzymanie się - nie wyrażono żadnej preferencji
  warnings:
    skipped_rank: Nie pomijaj rankingów.  Uszereguj kandydatów, wskazując swoje preferencje.  Niewybrani kandydaci będą na końcu.
    duplicate_rank: Nie przyznawaj równej pozycji kilku kandydatom. (Równe rankingi mogą unieważnić Twój głos.)

  methods:
    approval:
      instruction_bullets:
        - Zaznacz pole obok swojego faworyta
        - Możesz zaznaczyć dowolną liczbę — {{candidates}} nie podlegają limitowi
      footer_single_winner: Wygrywa {{candidate}} z największą liczbą głosów
      footer_multi_winner: 'Wygrywają {{candidates}} z największą liczbą głosów (liczba zwycięzców: {{n}})'
      left_title: ''
      right_title: ''
      heading_prefix: ''
    star_pr:
      instruction_bullets:
       - Swojemu faworytowi (lub faworytom) daj pięć gwiazdek — to maksimum, jakie może otrzymać {{candidate}}.
       - Swojemu ostatniemu wyborowi (lub wyborom) daj zero gwiazdek albo zostaw puste pole.
       - Resztę oceń według uznania — {{candidates}} mogą otrzymać od 0 do 5 gwiazdek.
       - Równe oceny oznaczają równe poparcie.
      footer_single_winner: ''
      footer_multi_winner: >
        Zwycięzcy w metodzie Proportional STAR Voting wyłaniani są w kolejnych rundach. W każdej rundzie zwycięża {{candidate}}
        z najwyższym łącznym wynikiem, a najsilniejsi zwolennicy, jakich ma {{candidate}}, zostają uznani za reprezentowanych.
        W kolejnych rundach uczestniczą wszyscy głosujący, którzy nie są jeszcze w pełni reprezentowani.
      # These show above the star columns
      left_title: 'Najgorzej'
      right_title: 'Najlepiej'
    star:
      instruction_bullets:
       - Swojemu faworytowi (lub faworytom) daj pięć gwiazdek.
       - Swojemu ostatniemu wyborowi (lub wyborom) daj zero gwiazdek albo zostaw puste pole.
       - Resztę oceń według uznania — {{candidates}} mogą otrzymać od 0 do 5 gwiazdek.
       - Równe oceny oznaczają równe poparcie.
      footer_single_winner: |
        Do finału przechodzą {{candidates}} z dwoma najwyższymi wynikami.
        Twój pełny głos trafia do finalisty, którego wolisz.
      footer_multi_winner: >
        Te wybory wykorzystują metodę STAR Voting i wyłonią {{n}} zwycięzców.
        W głosowaniu STAR do finału przechodzą {{candidates}} z dwoma najwyższymi wynikami, a wygrywa finalista preferowany przez większą liczbę głosujących.
      # These show above the star columns
      left_title: 'Najgorzej'
      right_title: 'Najlepiej'
    rcv:
      instruction_bullets:
        - Uszereguj według swoich preferencji — {{candidates}} otrzymują pozycje 1., 2., 3. itd.
        - Nadawanie równych pozycji nie jest dozwolone ({{candidates}} muszą mieć różne pozycje).
        - '{{capital_candidates}} pozostawieni bez pozycji trafiają na koniec'
      footer_single_winner: >
        Jak liczone jest RCV: karty do głosowania są liczone w rundach eliminacyjnych. W każdej rundzie Twój głos trafia,
        jeśli to możliwe, do najwyżej uszeregowanego przez Ciebie kandydata. Jeśli żaden kandydat nie ma większości pozostałych głosów,
        odpada kandydat z najmniejszą liczbą głosów. Jeśli Twojego głosu nie można przenieść, nie będzie on liczony w kolejnych rundach.
        Kandydat, który w danej rundzie zdobędzie większość pozostałych głosów, zostaje wybrany.
      left_title: ''
      right_title: ''
    stv:
      instruction_bullets:
        - Uszereguj według swoich preferencji — {{candidates}} otrzymują pozycje 1., 2., 3. itd.
        - Nadawanie równych pozycji nie jest dozwolone ({{candidates}} muszą mieć różne pozycje).
        - '{{capital_candidates}} pozostawieni bez pozycji trafiają na koniec'
      footer_multi_winner: ''
      left_title: ''
      right_title: ''
    ranked_robin:
      instruction_bullets:
        - Uszereguj według swoich preferencji — {{candidates}} otrzymują kolejne pozycje.
        - Równe pozycje są dozwolone
        - '{{capital_candidates}} pozostawieni bez pozycji trafiają na koniec'
      footer_single_winner: |
        {{capital_candidates}} rywalizują w pojedynkach jeden na jeden.
        Pojedynek wygrywa {{candidate}} z wyższą pozycją u większej liczby głosujących
      left_title: ''
      right_title: ''
    choose_one:
      instruction_bullets:
        - Zaznacz pole obok swojego faworyta
      footer_single_winner: Wygrywa {{candidate}} z największą liczbą głosów
      footer_multi_winner: 'Wygrywają {{candidates}} z największą liczbą głosów (liczba zwycięzców: {{n}})'
      left_title: ''
      right_title: ''

